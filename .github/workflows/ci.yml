name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  DATABASE_URL: postgresql+asyncpg://enrollio:enrollio@localhost:5432/enrollio
  TEST_DATABASE_URL: postgresql+asyncpg://enrollio:enrollio@localhost:5432/enrollio_test
  REDIS_URL: redis://localhost:6379/0
  # Present so create_app() starts in CI, which has no repository-root `.env`.
  JWT_SECRET: ci-test-secret-key-that-is-long-enough

jobs:
  backend:
    name: Backend lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enrollio
          POSTGRES_PASSWORD: enrollio
          POSTGRES_DB: enrollio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enrollio -d enrollio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Create integration-test database
        run: PGPASSWORD=enrollio psql -h localhost -U enrollio -d postgres -c 'CREATE DATABASE enrollio_test'

      - name: Lint (ruff)
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        working-directory: backend
        run: mypy app tests

      - name: Apply migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Test (unit + integration)
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (eslint)
        working-directory: frontend
        run: npm run lint

      - name: Type-check (tsc)
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests (vitest)
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: Playwright auth flows
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SEED_DEMO_USERS: "true"
      SEED_DEMO_PASSWORD: dev-only-password
      CORS_ORIGINS: http://localhost:3000
      # Inline processing lets the browser import flow finish without a worker.
      IMPORT_PROCESSING_MODE: inline
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: enrollio
          POSTGRES_PASSWORD: enrollio
          POSTGRES_DB: enrollio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U enrollio -d enrollio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          python -m app.seed

      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in {1..30}; do
            curl -fsS http://127.0.0.1:8000/healthz && break
            sleep 1
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: enrollio-api:ci

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: enrollio-web:ci

      - name: Validate compose file
        run: docker compose config --quiet
